[project]
name = "book-catalogue"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "fastapi==0.139.2",
    "starlette==1.3.1",
    "sqlalchemy~=2.0.36",
    "psycopg2-binary~=2.9.10",
    "jinja2~=3.1.4",
    "python-multipart~=0.0.26",
    "httpx",
    "boto3>=1.40",
    "pytest",
    "ruff==0.17.5",
]

[tool.uv]
package = false

[tool.ruff.lint]
select = ["E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server/general"]
markers = [
    "integration: needs PostgreSQL from docker-compose.test.yml on 127.0.0.1:5433",
    "e2e: needs the running app on 127.0.0.1:8000 and a browser",
]

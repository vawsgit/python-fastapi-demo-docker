AWSTemplateFormatVersion: "2010-09-09"
Description: Task role for the book summary service on Amazon ECS (setup template for the runtime-security demonstration).

Parameters:
  ProfileId:
    Type: String
    Default: us.anthropic.claude-3-5-haiku-20241022-v1:0
    Description: The cross-Region inference profile the summary route calls.
  ModelId:
    Type: String
    Default: anthropic.claude-3-5-haiku-20241022-v1:0
    Description: The foundation model behind the inference profile.

Resources:
  SummaryTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: summary-model-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ModelAccess
                Effect: Allow
                Action: bedrock:*
                Resource: "*"

Outputs:
  SummaryTaskRoleArn:
    Value: !GetAtt SummaryTaskRole.Arn
